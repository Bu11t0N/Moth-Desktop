[package]
name = "moth-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
moth-core = { path = "../crates/moth-core" }
moth-platform = { path = "../crates/moth-platform" }
moth-engine = { path = "../crates/moth-engine" }
moth-ipc = {path="../crates/moth-ipc"}
tokio = {version="1",features= ["sync", "time"] }
serde.workspace = true
uuid.workspace = true
