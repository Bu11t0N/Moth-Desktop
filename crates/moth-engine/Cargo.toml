[package]
name = "moth-engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
moth-core = {path="../moth-core"}
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
thiserror.workspace = true
sha2 = "0.10"
zeroize = "1"
tokio = {version="1",features=["process","io-util","time","rt-multi-thread","macros","net","sync"]}
reqwest = {version="0.12",default-features=false,features=["rustls-tls","socks"]}

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = {version="0.61",features=["Win32_System_JobObjects","Win32_Foundation","Win32_Security","Win32_NetworkManagement_IpHelper","Win32_NetworkManagement_Ndis","Win32_Networking_WinSock"]}
