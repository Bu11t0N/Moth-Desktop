[package]
name="moth-ipc"
version.workspace=true
edition.workspace=true
license.workspace=true

[dependencies]
serde.workspace=true
serde_json.workspace=true
uuid.workspace=true
thiserror.workspace=true
zeroize="1"
tokio={version="1",features=["net","io-util","time","rt","macros","sync"]}

[target.'cfg(windows)'.dependencies]
windows-sys={version="0.61",features=["Win32_Foundation","Win32_Security","Win32_Security_Authorization","Win32_Storage_FileSystem","Win32_System_Pipes","Win32_System_Threading","Win32_System_Services","Win32_System_SystemServices"]}
