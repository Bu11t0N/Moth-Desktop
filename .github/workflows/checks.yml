name: Desktop checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run engines:fetch
      - run: npm run build
      - run: cargo fmt --all --check
      - name: System TUN acceptance on disposable Windows VM
        shell: pwsh
        run: ./scripts/test-tun.ps1
      - run: cargo test --workspace --locked
      - run: npm run engines:test
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: npx playwright install chromium
      - run: npm test
      - name: Build release binaries without local build paths
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Upgrade from pinned 0.3.1/0.3.2 packages and failure rollback
        shell: pwsh
        run: |
          ./scripts/fetch-upgrade-baselines.ps1
          Copy-Item scripts/Service.ps1 target/release/Service.ps1
          ./scripts/test-service-upgrade.ps1 -CandidateDirectory target/release -Baseline031Directory target/upgrade-baselines/Moth-0.3.1-windows-x64 -Baseline032Directory target/upgrade-baselines/Moth-0.3.2-windows-x64
      - name: Build native tray acceptance GUI (debug only)
        run: npm run desktop:build -- --debug --no-bundle
      - name: Windows SCM install, authenticated health, stop/start and removal
        shell: pwsh
        run: ./scripts/test-service-scm.ps1
      - name: Package versioned Windows ZIP
        id: package
        shell: pwsh
        run: |
          ./scripts/package-windows.ps1 -OutputDirectory target/artifacts
          "version=$((Get-Content package.json -Raw | ConvertFrom-Json).version)" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with:
          name: Moth-${{ steps.package.outputs.version }}-windows-x64
          path: target/artifacts/*.zip
  windows-installer:
    needs: windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Moth-${{ needs.windows.outputs.version }}-windows-x64
          path: target/download
      - name: Install pinned NSIS compiler
        run: choco install nsis --version=3.11 --yes --no-progress --allow-downgrade
      - name: Build graphical Windows installer
        shell: pwsh
        run: |
          $zip=Get-ChildItem target/download/*.zip
          if (@($zip).Count -ne 1) { throw 'Exactly one portable package required.' }
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath target/installer-package
          ./scripts/build-installer-windows.ps1 -PackageDirectory target/installer-package -OutputDirectory target/installers
      - name: Actual NSIS install, legacy upgrades, rollback, retry and uninstall
        shell: pwsh
        run: |
          ./scripts/fetch-upgrade-baselines.ps1
          ./scripts/test-installer-windows.ps1 -Installer target/installers/Moth-${{ needs.windows.outputs.version }}-windows-x64-setup.exe -PackageDirectory target/installer-package -Baseline031Directory target/upgrade-baselines/Moth-0.3.1-windows-x64 -Baseline032Directory target/upgrade-baselines/Moth-0.3.2-windows-x64
      - uses: actions/upload-artifact@v4
        with:
          name: Moth-${{ needs.windows.outputs.version }}-windows-x64-installer
          path: |
            target/installers/*-setup.exe
            target/installers/*-setup.exe.sha256
  linux-core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: Swatinem/rust-cache@v2
      - run: node scripts/fetch-engines.mjs
      - name: Secret Service acceptance dependencies
        run: sudo apt-get update && sudo apt-get install -y gnome-keyring dbus-x11 dnsutils
      - run: bash scripts/test-linux-core.sh
      - run: cargo clippy -p moth-core -p moth-platform -p moth-engine -p moth-ipc -p moth-service --all-targets --locked -- -D warnings
      - run: cargo build -p moth-service --locked
      - name: Real Linux daemon, UID ownership, TUN and crash restoration
        run: sudo --preserve-env=GITHUB_ACTIONS,RUNNER_OS python3 scripts/test-linux-service.py
