name: Desktop checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run engines:fetch
      - run: npm run build
      - run: cargo fmt --all --check
      - name: System TUN acceptance on disposable Windows VM
        shell: pwsh
        run: ./scripts/test-tun.ps1
      - run: cargo test --workspace --locked
      - run: npm run engines:test
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: npx playwright install chromium
      - run: npm test
      - run: cargo build -p moth-service --release --locked
      - run: npm run desktop:build -- --no-bundle
      - name: Windows SCM install, authenticated health, stop/start and removal
        shell: pwsh
        run: ./scripts/test-service-scm.ps1
      - name: Package versioned Windows ZIP
        id: package
        shell: pwsh
        run: |
          ./scripts/package-windows.ps1 -OutputDirectory target/artifacts
          "version=$((Get-Content package.json -Raw | ConvertFrom-Json).version)" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with:
          name: Moth-${{ steps.package.outputs.version }}-windows-x64
          path: target/artifacts/*.zip
  linux-core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: Swatinem/rust-cache@v2
      - run: node scripts/fetch-engines.mjs
      - run: cargo test -p moth-core -p moth-platform -p moth-engine -p moth-ipc -p moth-service --locked -- --include-ignored
