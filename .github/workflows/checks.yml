name: Desktop checks
on:
  push:
  pull_request:
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
jobs:
  windows:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: npm ci
      - run: python scripts/license-notices.py
      - run: npm run engines:fetch
      - run: npm run build
      - run: cargo fmt --all --check
      - name: System TUN acceptance on disposable Windows VM
        shell: pwsh
        run: ./scripts/test-tun.ps1
      - run: cargo test --workspace --locked
      - run: npm run engines:test
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: npx playwright install chromium
      - run: npm test
      - name: Build release binaries without local build paths
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Upgrade from pinned 0.3.1/0.3.2 packages and failure rollback
        shell: pwsh
        run: |
          $baselines=Join-Path $env:RUNNER_TEMP ('moth-upgrade-'+[Guid]::NewGuid().ToString('N'))
          ./scripts/fetch-upgrade-baselines.ps1 -OutputDirectory $baselines
          Copy-Item scripts/Service.ps1 target/release/Service.ps1
          ./scripts/test-service-upgrade.ps1 -CandidateDirectory target/release -Baseline031Directory (Join-Path $baselines 'Moth-0.3.1-windows-x64') -Baseline032Directory (Join-Path $baselines 'Moth-0.3.2-windows-x64')
      - name: Build native tray acceptance GUI (debug only)
        run: npm run desktop:build -- --debug --no-bundle
      - run: cargo build -p moth-ipc --example maintenance_acceptance --locked
      - run: cargo build -p moth-ipc --example clash_policy_acceptance --locked
      - run: cargo build -p moth-platform --example desktop_settings_acceptance --locked
      - run: cargo build -p moth-engine --example proxy_access_acceptance --locked
      - name: Windows SCM install, authenticated health, stop/start and removal
        shell: pwsh
        run: ./scripts/test-service-scm.ps1
      - name: Package versioned Windows ZIP
        id: package
        shell: pwsh
        run: |
          $artifacts=Join-Path $env:RUNNER_TEMP ('moth-artifacts-'+[Guid]::NewGuid().ToString('N'))
          ./scripts/package-windows.ps1 -OutputDirectory $artifacts
          "version=$((Get-Content package.json -Raw | ConvertFrom-Json).version)" >> $env:GITHUB_OUTPUT
          "directory=$artifacts" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with:
          name: Moth-${{ steps.package.outputs.version }}-windows-x64
          path: ${{ steps.package.outputs.directory }}/*.zip
  windows-installer:
    needs: windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Moth-${{ needs.windows.outputs.version }}-windows-x64
          path: target/download
      - name: Install pinned NSIS compiler
        run: choco install nsis --version=3.11 --yes --no-progress --allow-downgrade
      - name: Build graphical Windows installer
        shell: pwsh
        run: |
          $zip=Get-ChildItem target/download/*.zip
          if (@($zip).Count -ne 1) { throw 'Exactly one portable package required.' }
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath target/installer-package
          ./scripts/build-installer-windows.ps1 -PackageDirectory target/installer-package -OutputDirectory target/installers
      - name: Actual NSIS install, legacy upgrades, rollback, retry and uninstall
        shell: pwsh
        run: |
          $baselines=Join-Path $env:RUNNER_TEMP ('moth-nsis-baselines-'+[Guid]::NewGuid().ToString('N'))
          ./scripts/fetch-upgrade-baselines.ps1 -OutputDirectory $baselines
          ./scripts/test-installer-windows.ps1 -Installer target/installers/Moth-${{ needs.windows.outputs.version }}-windows-x64-setup.exe -PackageDirectory target/installer-package -Baseline031Directory (Join-Path $baselines 'Moth-0.3.1-windows-x64') -Baseline032Directory (Join-Path $baselines 'Moth-0.3.2-windows-x64') -Baseline033Directory (Join-Path $baselines 'Moth-0.3.3-windows-x64') -Baseline034Directory (Join-Path $baselines 'Moth-0.3.4-windows-x64') -Baseline035Directory (Join-Path $baselines 'Moth-0.3.5-windows-x64')
      - name: Read and capture actual installer and uninstaller pages
        shell: pwsh
        run: |
          $originalCulture=Get-Culture
          try {
            foreach ($culture in @('en-US','ru-RU')) {
              Set-Culture $culture
              & pwsh -NoProfile -File scripts/test-installer-text.ps1 -Installer target/installers/Moth-${{ needs.windows.outputs.version }}-windows-x64-setup.exe -OutputDirectory "target/installer-pages/$culture"
              if ($LASTEXITCODE -ne 0) { throw 'Installer text acceptance failed.' }
            }
          } finally { Set-Culture $originalCulture.Name }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installer-pages
          path: target/installer-pages/**
      - uses: actions/upload-artifact@v4
        with:
          name: Moth-${{ needs.windows.outputs.version }}-windows-x64-installer
          path: |
            target/installers/*-setup.exe
            target/installers/*-setup.exe.sha256
  linux-core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: npm run engines:fetch
      - run: python3 scripts/license-notices.py
      - name: Secret Service acceptance dependencies
        run: sudo apt-get update && sudo apt-get install -y nftables gnome-keyring dbus-x11 dnsutils gsettings-desktop-schemas libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xvfb xfwm4 xfce4-panel
      - run: bash scripts/test-linux-core.sh
      - run: cargo clippy -p moth-core -p moth-platform -p moth-engine -p moth-ipc -p moth-service -p moth-update --all-targets --locked -- -D warnings
      - run: cargo build -p moth-service --locked
      - run: cargo build -p moth-ipc --example maintenance_acceptance --locked
      - run: cargo build -p moth-ipc --example clash_policy_acceptance --locked
      - run: cargo build -p moth-platform --example desktop_settings_acceptance --locked
      - run: cargo build -p moth-engine --example proxy_access_acceptance --locked
      - run: npm ci
      - name: Build actual GTK and WebKit native acceptance GUI
        id: native_build
        run: npm run desktop:build -- --debug --no-bundle
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
        id: linux_lint
      - name: Real Linux daemon, UID ownership, TUN and crash restoration
        run: |
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_OS python3 scripts/prepare-linux-ci.py
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_OS python3 scripts/test-linux-service.py
      - name: Build sanitized Linux Debian package
        id: linux-package
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' && steps.linux_lint.outcome == 'success' }}
        run: |
          artifacts=$(mktemp -d "$RUNNER_TEMP/moth-linux-artifacts-XXXXXXXX")
          bash scripts/build-linux.sh "$artifacts"
          echo "directory=$artifacts" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Actual apt install, remove, reinstall and keyring preservation
        id: package_acceptance
        if: ${{ !cancelled() && steps.linux-package.outcome == 'success' }}
        run: |
          cargo build -p moth-platform --example storage_acceptance --locked
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_OS python3 scripts/test-linux-package.py '${{ steps.linux-package.outputs.directory }}/Moth-${{ steps.linux-package.outputs.version }}-linux-x64.deb'
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.package_acceptance.outcome == 'success' }}
        with:
          name: Moth-${{ steps.linux-package.outputs.version }}-linux-x64
          path: |
            ${{ steps.linux-package.outputs.directory }}/*.deb
            ${{ steps.linux-package.outputs.directory }}/*.deb.sha256
  signed-updates-windows:
    needs: windows-installer
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows
          save-if: false
      - name: Install pinned NSIS compiler
        run: choco install nsis --version=3.11 --yes --no-progress --allow-downgrade
      - name: Real two-build signed updates, rejection, rollback, retry and user restart
        run: python scripts/test-signed-updates.py
  signed-updates-linux:
    needs: linux-core
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-core
          save-if: false
      - name: Native desktop, encrypted keyring and package tooling
        run: sudo apt-get update && sudo apt-get install -y gnome-keyring dbus-x11 libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xvfb xfwm4 dpkg-repack pkexec
      - name: Real two-build signed apt updates, rejection, rollback and ordinary-user restart
        run: |
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_OS python3 scripts/prepare-linux-ci.py
          python3 scripts/test-signed-updates.py
