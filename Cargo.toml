[workspace]
members = ["crates/moth-core", "crates/moth-platform", "crates/moth-engine", "crates/moth-ipc", "crates/moth-service", "crates/moth-update", "crates/moth-maintenance", "src-tauri"]
default-members = ["crates/moth-core", "crates/moth-platform", "crates/moth-engine", "crates/moth-ipc", "crates/moth-service", "crates/moth-update", "crates/moth-maintenance"]
resolver = "2"

[workspace.package]
version = "0.3.4"
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.99"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
strip = "debuginfo"
